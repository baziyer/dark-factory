[workspace]
members = ["crates/factory-core", "crates/factory-runner", "crates/factory-tui", "crates/factoryctl", "crates/factoryd"]
resolver = "3"

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process", "termios"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.24.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
