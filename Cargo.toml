[workspace]
members = ["crates/factory-core", "crates/factory-runner", "crates/factoryctl", "crates/factoryd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.24.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
