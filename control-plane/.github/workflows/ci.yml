name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # One required status and one repository-owned gate. Clippy and the two test
  # lanes compile every target they exercise, so a separate cargo build would
  # only rebuild the same source without adding proof.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Avoid a dependency on downloaded checkout actions. The repository is
      # public, and GitHub serves both pushed commits and PR merge commits by
      # the event's exact SHA.
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Run the authoritative source gate
        run: ./scripts/local-ci.sh
