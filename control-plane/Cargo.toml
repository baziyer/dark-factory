[package]
name = "dark-factory-control-plane"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[features]
default = []
development-sqlite = ["dep:rusqlite"]
provision-runtime = ["dep:reqwest", "dep:serde"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tower = "0.5.3"
url = "2.5.8"
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "broker"
path = "api/broker.rs"

[[bin]]
name = "runtime-bootstrap"
path = "tools/runtime_bootstrap.rs"
required-features = ["provision-runtime"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# This directory is an exportable standalone service, not a dark-factory
# workspace member. It will move to the sibling control-plane repository.
[workspace]
