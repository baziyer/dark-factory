[package]
name = "dark-factory-control-plane"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[features]
default = []
development-sqlite = ["dep:rusqlite"]

[dependencies]
axum = { version = "0.8.9", default-features = false }
hex = "0.4.3"
hmac = "0.12.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.20"
tower = "0.5.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.125"
worker = { version = "=0.8.5", features = ["http", "axum"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# This directory is an exportable standalone service, not a dark-factory
# workspace member. It will move to the sibling control-plane repository.
[workspace]
