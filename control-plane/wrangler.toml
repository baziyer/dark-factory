name = "dark-factory-control-plane"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-22"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

[[durable_objects.bindings]]
name = "DARK_FACTORY_MAINTAINER_DELIVERIES"
class_name = "MaintainerDeliveryJournal"

[exports.MaintainerDeliveryJournal]
type = "durable-object"
storage = "sqlite"

[secrets]
required = [
    "DARK_FACTORY_MAINTAINER_WEBHOOK_SECRET",
    "DARK_FACTORY_MAINTAINER_WEBHOOK_SECRET_REVISION",
    "DARK_FACTORY_MAINTAINER_APP_ID",
]
