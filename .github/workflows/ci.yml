name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # One job, one required status check ("checks"). It runs the exact same
  # gate as `./scripts/local-ci.sh` — nothing is re-implemented here.
  #
  # Where it runs is chosen by this expression, which is a policy, not a
  # mechanism: a pull request runs the workflow file from ITS OWN merge
  # ref, so a fork can edit `runs-on` here. Same-repository refs (the
  # owner's and collaborators' branches, and every push to main) run on
  # the persistent self-hosted Mac (`dark-factory-mac`: warm cargo cache,
  # real macOS, no hosted minutes). A pull request from a fork runs on an
  # ephemeral hosted macOS runner — and every fork's workflow run needs the
  # maintainer's approval first (`scripts/github-repo-settings.sh` sets
  # that policy). Read `.github/workflows/` in a fork's diff before
  # approving it: that is the boundary. See docs/development/WORKFLOW.md.
  checks:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      # No actions/checkout: codeload.github.com (which serves an action's
      # tarball) can 429 independently of git itself and has, for over an
      # hour at a time, on this runner — with no code checked out and
      # nothing to retry. A plain `git fetch` talks straight to GitHub's
      # git server instead, so this job never depends on that download.
      #
      # This runner's workspace persists between jobs, so the step below
      # must leave a clean tree at exactly $GITHUB_SHA even if a previous
      # job left files behind: initialize the workspace as a repo if it
      # isn't one yet, fetch that one commit, force-checkout it detached,
      # then `git clean -ffdx` everything else a prior job left. That clean
      # never touches the cargo cache: CARGO_TARGET_DIR lives outside this
      # workspace (see docs/development/WORKFLOW.md, "The self-hosted
      # runner").
      #
      # $GITHUB_SHA is the PR's merge commit for `pull_request` events and
      # the pushed commit for `push`/`workflow_dispatch`; GitHub serves
      # `git fetch` by arbitrary commit SHA either way, including a PR's
      # hidden merge-commit ref (verified against this repository). The
      # repo is public, so the fetch is unauthenticated and nothing is
      # written to .git/config that could leak a credential.
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          if [ ! -d .git ]; then
            git init
          fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Run the gate
        run: ./scripts/local-ci.sh
