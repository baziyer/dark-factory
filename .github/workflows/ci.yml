name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # One job, one required status check ("checks"). It runs the exact same
  # gate as `./scripts/local-ci.sh` — nothing is re-implemented here.
  #
  # Same-repository refs (the owner's and collaborators' branches, and every
  # push to main) run on the persistent self-hosted Mac (`dark-factory-mac`,
  # see docs/development/WORKFLOW.md): warm cargo cache, real macOS, no
  # hosted minutes. A pull request from a fork executes untrusted code, so it
  # runs on an ephemeral hosted macOS runner instead and never reaches that
  # machine — the same boundary the owner's other repositories use.
  checks:
    name: checks
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-latest' || 'dark-factory-mac' }}
    timeout-minutes: 45
    steps:
      # Pinned to a commit because this job may execute on a persistent
      # machine as its login user.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Run the gate
        run: ./scripts/local-ci.sh
