name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The macOS job is the release-compatible source gate. Linux uses the same
  # shared Rust source-gate seam with an explicit source-only mode; macOS
  # release/publisher/package fixtures stay macOS-only until #142/#143.
  #
  # `runs-on` below is a policy, not a mechanism: a pull request runs the
  # workflow file it carries, so this expression only governs a PR that
  # leaves it unmodified — see docs/development/WORKFLOW.md, "CI and
  # GitHub" for the full trust boundary (fork approval, same-repository
  # PRs, workflow_dispatch, and the persistent runner's own isolation as a
  # tracked follow-up). Not duplicated here on purpose, so there's one
  # place to keep accurate instead of two.
  checks:
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'dark-factory-mac' }}
    timeout-minutes: 45
    steps:
      # No actions/checkout: codeload.github.com (which serves an action's
      # tarball) can 429 independently of git itself and has, for over an
      # hour at a time, on this runner — with no code checked out and
      # nothing to retry. A plain `git fetch` talks straight to GitHub's
      # git server instead, so this job never depends on that download.
      #
      # This runner's workspace persists between jobs, and the
      # `cancel-in-progress` concurrency group above can SIGTERM a job
      # mid-checkout (an ordinary fixup push while the previous push's
      # `checks` is still running), so a prior job can leave more than
      # stray files behind: a `.git/index.lock`, a half-written pack, a
      # stale shallow boundary. `rm -rf .git && git init` before every
      # fetch throws all of that away in one move instead of trying to
      # detect and repair each kind of leftover state, then `git checkout
      # --force --detach` lands on the target commit and `git clean -ffdx`
      # removes anything else a prior job left in the working tree. That
      # clean never touches the cargo cache: CARGO_TARGET_DIR lives outside
      # this workspace (see docs/development/WORKFLOW.md, "The self-hosted
      # runner").
      #
      # $GITHUB_SHA is the PR's merge commit for `pull_request` events and
      # the pushed commit for `push`/`workflow_dispatch`; GitHub serves
      # `git fetch` by arbitrary commit SHA either way, including a PR's
      # hidden merge-commit ref (verified against this repository). The
      # repo is public, so the fetch is unauthenticated and nothing is
      # written to .git/config that could leak a credential.
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Run the macOS source gate
        run: ./scripts/local-ci.sh

      - name: Run the macOS causal source smoke
        run: |
          cargo +1.88.0 build --locked --workspace
          ./scripts/macos-contributor-smoke.sh
          ./scripts/test-macos-contributor-smoke.sh

      - name: Run the disposable launchd release proof
        run: ./scripts/macos-launchd-release-proof.sh

      - name: Publish bounded workflow summary
        if: always()
        env:
          DF_SUMMARY_KIND: CI
          DF_SUMMARY_REF: ${{ github.ref }}
          DF_SUMMARY_SHA: ${{ github.sha }}
          DF_SUMMARY_RESULT: ${{ job.status }}
          DF_SUMMARY_TARGET: ${{ github.event.pull_request.milestone.title || 'unassigned' }}
          DF_SUMMARY_TARGET_URL: ${{ github.event.pull_request.milestone.html_url || format('{0}/{1}/milestones', github.server_url, github.repository) }}
          DF_SUMMARY_RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          if [ -x ./scripts/github-step-summary.sh ]; then
            ./scripts/github-step-summary.sh
          else
            # The checkout can fail before repository files exist. Keep this
            # immutable fallback static: no untrusted value is interpolated.
            {
              printf '%s\n' '### Dark Factory workflow summary'
              printf '%s\n' '- Result: <code>failure</code>'
              printf '%s\n' '- Ref: <code>unavailable before checkout</code>'
              printf '%s\n' '- SHA: <code>unavailable before checkout</code>'
              printf '%s\n' '- Release target: <code>unavailable before checkout</code>'
              printf '%s\n' '- Links: workflow run summary'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

  # The repository's single required context is deliberately an aggregate:
  # GitHub must require both hosted source gates, not just whichever job name
  # happened to be selected when the ruleset was first configured.
  required:
    if: always()
    needs: [checks, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both hosted source gates
        if: needs.checks.result != 'success' || needs.linux.result != 'success'
        run: |
          echo "required source gates failed: macOS=${{ needs.checks.result }}, Linux=${{ needs.linux.result }}" >&2
          exit 1
      - name: Confirm both hosted source gates passed
        run: echo "macOS and Linux source gates passed"

  # Ubuntu is the source-contributor preview gate. It keeps the macOS
  # compatibility gate above intact while making the Linux claim explicit:
  # x86-64 source builds, the shared deterministic Rust suite, and the public
  # factoryd/factoryctl/factory-tui shell smoke all run on Ubuntu.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Verify Ubuntu x86-64 runner
        run: |
          set -euxo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Run the Linux authoritative gate
        run: ./scripts/local-ci.sh --linux-source

      # The gate has already compiled every target. Build only the normal
      # binaries that the following shell smoke executes, after clippy/tests
      # so the gate cannot invalidate and rebuild an up-front cargo build.
      - name: Build the workspace binaries
        run: cargo +1.88.0 build --locked --workspace --bins

      - name: Verify source-gate mode boundary
        run: ./scripts/test-local-ci-mode.sh

      - name: Verify repository settings proposal
        run: ./scripts/test-repository-settings.sh

      - name: Run the source contributor smoke
        run: ./scripts/linux-contributor-smoke.sh

      - name: Verify interrupted smoke teardown
        run: ./scripts/test-linux-contributor-smoke.sh
