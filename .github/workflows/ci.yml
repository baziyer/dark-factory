name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Run local-ci
        run: ./scripts/local-ci.sh
