name: Release

# A semver tag (`v0.1.0`) pushed by a maintainer builds the macOS arm64
# binaries and publishes them, a SHA256SUMS file, and the `latest.json`
# manifest as a GitHub Release. `factoryctl update` reads that manifest at
# https://github.com/baziyer/dark-factory/releases/latest/download/latest.json;
# see docs/development/WORKFLOW.md, "Release and update".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    # Only maintainers can push tags, so this is a trusted ref (same boundary
    # as CI's same-repository jobs): the persistent Mac, warm cache, real
    # macOS arm64.
    runs-on: dark-factory-mac
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      TARGET: aarch64-apple-darwin
    steps:
      # No actions/checkout: codeload.github.com (which serves an action's
      # tarball) can 429 independently of git itself, so this job never
      # depends on that download — a plain `git fetch` talks straight to
      # GitHub's git server instead. See ci.yml for the full rationale;
      # this is the same step.
      #
      # This runner's workspace persists between jobs (it is shared with
      # ci.yml's `checks` job), so the step below must leave a clean tree
      # at exactly $GITHUB_SHA even if a previous job left files behind:
      # initialize the workspace as a repo if it isn't one yet, fetch that
      # one commit, force-checkout it detached, then `git clean -ffdx`
      # everything else a prior job left. That clean never touches the
      # cargo cache: CARGO_TARGET_DIR lives outside this workspace (see
      # docs/development/WORKFLOW.md, "The self-hosted runner").
      #
      # For a tag push, $GITHUB_SHA is the commit the tag points at; GitHub
      # serves `git fetch` by arbitrary commit SHA (verified against this
      # repository). The repo is public, so the fetch is unauthenticated
      # and nothing is written to .git/config that could leak a credential.
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          if [ ! -d .git ]; then
            git init
          fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Check that the tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match Cargo.toml workspace version $version" >&2
            exit 1
          fi

      - name: Build release binaries
        run: cargo +1.85.0 build --locked --release --workspace

      - name: Package
        run: ./scripts/package-release.sh "$TAG" "$TARGET" "${CARGO_TARGET_DIR:-target}/release" dist "$GITHUB_REPOSITORY"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a pre-release suffix (v0.2.0-rc.1) is published as a
        # pre-release, so `releases/latest` -- and every `factoryctl update`
        # -- keeps pointing at the newest full release.
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes $prerelease dist/*
