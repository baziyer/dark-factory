[package]
name = "factoryd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
factory-core = { path = "../factory-core" }
getrandom = "0.3"
rusqlite.workspace = true
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt"] }
uuid.workspace = true

[dev-dependencies]
# Path deps purely so `env!("CARGO_BIN_EXE_factory-runner")`/
# `env!("CARGO_BIN_EXE_factoryctl")` resolve in `tests/sessions_e2e.rs`,
# which drives a real factoryd + factory-runner + factoryctl over the real
# local socket protocol. `factory-runner` already dev-depends on `factoryd`
# the same way for its own execution_e2e-style tests; Cargo permits a
# dev-dependency cycle (it never participates in the normal build graph).
factory-runner = { path = "../factory-runner" }
factoryctl = { path = "../factoryctl" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
